services:
  postgres:
    image: postgres:16-alpine
    container_name: metalagents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metalagents
      POSTGRES_PASSWORD: metalagents_secret
      POSTGRES_DB: metalagents
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metalagents -d metalagents"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
